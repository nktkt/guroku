[package]
name = "guroku"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "A fast, Rust-powered package manager for the JavaScript ecosystem."
license = "MIT"
repository = "https://github.com/nktkt/guroku"
readme = "README.md"
keywords = ["package-manager", "npm", "node", "javascript"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "guroku"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
flate2 = "1"
tar = "0.4"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
dirs = "5"
indicatif = "0.17"
bytes = "1"
node-semver = "2"
glob = "0.3"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "lockfile_parse"
harness = false

[[bench]]
name = "manifest_parse"
harness = false

[[bench]]
name = "spec_classify"
harness = false

[[bench]]
name = "version_satisfies"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

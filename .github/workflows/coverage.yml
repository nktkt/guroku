name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate lcov coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      # CODECOV_TOKEN is optional for public repositories; Codecov will accept
      # uploads from public repos without a token. For private repos, set the
      # CODECOV_TOKEN secret in the repository settings.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload lcov.info as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-info
          path: lcov.info
